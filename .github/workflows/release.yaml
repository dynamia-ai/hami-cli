name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  GOPRIVATE: github.com/dynamia-ai/*
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.17.1
  OSSUTIL_VERSION: 2.3.0
  OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
  IMAGE: ghcr.io/${{ github.repository_owner }}/hami-cli
  ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL }}
  S3_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.S3_PUBLIC_DOWNLOAD_BASE_URL }}

jobs:
  release:
    name: Publish stable release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" = tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "source-date-epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Validate credentials
        env:
          HAMI_ENTERPRISE_REPO_TOKEN: ${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          test -n "$HAMI_ENTERPRISE_REPO_TOKEN"
          test -n "$ALIYUN_OSS_ACCESS_KEY_ID"
          test -n "$ALIYUN_OSS_ACCESS_KEY_SECRET"
          test -n "$ALIYUN_OSS_BUCKET"
          test -n "$ALIYUN_OSS_ENDPOINT"
          test -n "$ALIYUN_OSS_REGION"
          test -n "$S3_ACCESS_KEY_ID"
          test -n "$S3_SECRET_ACCESS_KEY"
          test -n "$S3_BUCKET"
          test -n "$S3_ENDPOINT"
          test -n "$S3_REGION"
          test -n "$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL"
          test -n "$S3_PUBLIC_DOWNLOAD_BASE_URL"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run release checks
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: make ci

      - name: Build release artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/

      - name: Prepare image context from release binaries
        run: bash hack/prepare-release-image-context.sh dist "$RUNNER_TEMP/release-image"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build immutable image archive
        id: image-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/release-image
          file: ${{ runner.temp }}/release-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/hami-cli-image.tar
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.release.outputs.source-date-epoch }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image digest
        id: image-archive
        run: |
          set -euo pipefail
          digest="$(tar -xOf "$RUNNER_TEMP/hami-cli-image.tar" index.json \
            | jq -r '.manifests | if length == 1 then .[0].digest else error("unexpected manifest count") end')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > dist/image-digest.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        id: actions-artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/image-digest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl -fsSLo "$workdir/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          echo "$OSSUTIL_SHA256  $workdir/ossutil.zip" | sha256sum --check --strict
          unzip -q "$workdir/ossutil.zip" -d "$workdir"
          sudo install -m 0755 \
            "$workdir/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version

      - name: Publish immutable artifacts to OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
        run: bash hack/publish-oss.sh immutable "$GITHUB_REF_NAME" dist

      - name: Verify AWS CLI
        run: |
          aws --version
          aws s3api put-object --generate-cli-skeleton input | jq -e 'has("IfNoneMatch")'

      - name: Publish immutable artifacts to S3
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: bash hack/publish-s3.sh immutable "$GITHUB_REF_NAME" dist

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable image tag
        id: image-state
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.image-archive.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE:$GITHUB_REF_NAME"
          lookup_error="$RUNNER_TEMP/image-lookup-error"
          if docker buildx imagetools inspect "$image_ref" >/dev/null 2>"$lookup_error"; then
            manifest="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}')"
            test "$(jq -r '.digest' <<< "$manifest")" = "$EXPECTED_DIGEST"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eqi 'not found|manifest unknown|name unknown' "$lookup_error"; then
            echo "failed to determine whether immutable image tag exists: $image_ref" >&2
            sed -n '1,20p' "$lookup_error" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish immutable image archive
        if: steps.image-state.outputs.publish == 'true'
        run: |
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "oci-archive:$RUNNER_TEMP/hami-cli-image.tar" \
            "docker://$IMAGE:$GITHUB_REF_NAME"

      - name: Resolve and verify image digest
        id: image
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.image-archive.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE:$GITHUB_REF_NAME"
          manifest="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<< "$manifest")"
          test "$digest" = "$EXPECTED_DIGEST"
          for platform in linux/amd64 linux/arm64; do
            metadata="$(docker buildx imagetools inspect "$image_ref" \
              --format "{{json (index .Image \"$platform\")}}")"
            test "$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$metadata")" = "$GITHUB_SHA"
            test "$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<< "$metadata")" = "$GITHUB_REF_NAME"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify public artifacts
        shell: bash
        run: |
          set -euo pipefail
          for configured_base_url in "$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL" "$S3_PUBLIC_DOWNLOAD_BASE_URL"; do
            base_url="${configured_base_url%/}"
            [[ "$base_url" = https://* ]]
            for file in dist/*.tar.gz dist/checksums.txt dist/image-digest.txt; do
              curl --retry 8 --retry-all-errors -fsSLo "$RUNNER_TEMP/${file##*/}" \
                "$base_url/$GITHUB_REF_NAME/${file##*/}"
              cmp "$file" "$RUNNER_TEMP/${file##*/}"
            done
          done

      - name: Create authenticated GitHub Release mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash hack/publish-github-release.sh "$GITHUB_REF_NAME" dist
          "$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL" "$S3_PUBLIC_DOWNLOAD_BASE_URL" "$IMAGE"

      - name: Write published artifact summary
        env:
          ACTIONS_ARTIFACT_NAME: release-binaries-${{ github.ref_name }}
          ACTIONS_ARTIFACT_RETENTION_DAYS: "30"
          ACTIONS_ARTIFACT_URL: ${{ steps.actions-artifact.outputs.artifact-url }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          bash hack/write-release-summary.sh
          "$GITHUB_REF_NAME" dist "$IMAGE" "$IMAGE_DIGEST"
