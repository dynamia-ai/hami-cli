name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  GOPRIVATE: github.com/dynamia-ai/*
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.17.1
  OSSUTIL_VERSION: 2.3.0
  OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
  IMAGE: ghcr.io/${{ github.repository_owner }}/hami-cli
  ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL }}
  S3_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.S3_PUBLIC_DOWNLOAD_BASE_URL }}

jobs:
  build:
    name: Build stable release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      image-digest: ${{ steps.image-archive.outputs.digest }}
      binary-artifact-id: ${{ steps.binary-artifact.outputs.artifact-id }}
      image-artifact-id: ${{ steps.image-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate stable tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" = tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          echo "source-date-epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Validate private module credential
        env:
          HAMI_ENTERPRISE_REPO_TOKEN: ${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}
        run: test -n "$HAMI_ENTERPRISE_REPO_TOKEN"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run release checks
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: make ci

      - name: Build release artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/

      - name: Verify release archive contents
        run: bash hack/verify-release-archives.sh dist

      - name: Prepare image context from release binaries
        run: bash hack/prepare-release-image-context.sh dist "$RUNNER_TEMP/release-image"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build release image archive
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ runner.temp }}/release-image
          file: ${{ runner.temp }}/release-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/hami-cli-image.tar
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.release.outputs.source-date-epoch }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record release image digest
        id: image-archive
        run: |
          set -euo pipefail
          digest="$(tar -xOf "$RUNNER_TEMP/hami-cli-image.tar" index.json \
            | jq -r '.manifests | if length == 1 then .[0].digest else error("unexpected manifest count") end')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > dist/image-digest.txt
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload stable binary payload
        id: binary-artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/image-digest.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload stable image payload
        id: image-artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ github.ref_name }}
          path: ${{ runner.temp }}/hami-cli-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  validate_distribution:
    name: Validate stable distribution configuration
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate publication credentials and endpoints
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          test -n "$ALIYUN_OSS_ACCESS_KEY_ID"
          test -n "$ALIYUN_OSS_ACCESS_KEY_SECRET"
          test -n "$ALIYUN_OSS_BUCKET"
          test -n "$ALIYUN_OSS_ENDPOINT"
          test -n "$ALIYUN_OSS_REGION"
          test -n "$S3_ACCESS_KEY_ID"
          test -n "$S3_SECRET_ACCESS_KEY"
          test -n "$S3_BUCKET"
          test -n "$S3_ENDPOINT"
          test -n "$S3_REGION"
          test -n "$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL"
          test -n "$S3_PUBLIC_DOWNLOAD_BASE_URL"

  publish_oss:
    name: Publish stable binaries to OSS
    needs: [build, validate_distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false

      - name: Download stable binary payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ github.ref_name }}
          path: dist

      - name: Validate release tooling and binary payload
        run: |
          test "$(git -C release-control rev-parse HEAD)" = "$GITHUB_SHA"
          bash release-control/hack/verify-release-archives.sh dist

      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl -fsSLo "$workdir/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          echo "$OSSUTIL_SHA256  $workdir/ossutil.zip" | sha256sum --check --strict
          unzip -q "$workdir/ossutil.zip" -d "$workdir"
          sudo install -m 0755 \
            "$workdir/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version

      - name: Publish stable artifacts to OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
        run: bash release-control/hack/publish-oss.sh stable "$GITHUB_REF_NAME" dist

      - name: Verify public artifacts from OSS
        shell: bash
        run: >-
          bash release-control/hack/verify-public-artifacts.sh "$GITHUB_REF_NAME" dist
          "aliyun-oss=$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL"

  publish_s3:
    name: Publish stable binaries to S3
    needs: [build, validate_distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false

      - name: Download stable binary payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ github.ref_name }}
          path: dist

      - name: Validate release tooling and binary payload
        run: |
          test "$(git -C release-control rev-parse HEAD)" = "$GITHUB_SHA"
          bash release-control/hack/verify-release-archives.sh dist

      - name: Verify AWS CLI
        run: aws --version

      - name: Publish stable artifacts to S3
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: bash release-control/hack/publish-s3.sh stable "$GITHUB_REF_NAME" dist

      - name: Verify public artifacts from S3
        shell: bash
        run: >-
          bash release-control/hack/verify-public-artifacts.sh "$GITHUB_REF_NAME" dist
          "s3=$S3_PUBLIC_DOWNLOAD_BASE_URL"

  publish_ghcr:
    name: Publish stable image to GHCR
    needs: [build, validate_distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download stable image payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-image-${{ github.ref_name }}
          path: dist

      - name: Validate image payload
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          set -euo pipefail
          digest="$(tar -xOf dist/hami-cli-image.tar index.json \
            | jq -r '.manifests | if length == 1 then .[0].digest else error("unexpected manifest count") end')"
          test "$digest" = "$EXPECTED_DIGEST"

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release image archive
        run: |
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "oci-archive:$GITHUB_WORKSPACE/dist/hami-cli-image.tar" \
            "docker://$IMAGE:$GITHUB_REF_NAME"

      - name: Resolve and verify published image digest
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE:$GITHUB_REF_NAME"
          manifest="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<< "$manifest")"
          test "$digest" = "$EXPECTED_DIGEST"
          for platform in linux/amd64 linux/arm64; do
            metadata="$(docker buildx imagetools inspect "$image_ref" \
              --format "{{json (index .Image \"$platform\")}}")"
            test "$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$metadata")" = "$GITHUB_SHA"
            test "$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<< "$metadata")" = "$GITHUB_REF_NAME"
          done

  publish_github:
    name: Publish stable GitHub Release
    needs: [build, validate_distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false

      - name: Download stable binary payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ github.ref_name }}
          path: dist

      - name: Validate release tooling and binary payload
        run: |
          test "$(git -C release-control rev-parse HEAD)" = "$GITHUB_SHA"
          bash release-control/hack/verify-release-archives.sh dist

      - name: Create authenticated GitHub Release mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash release-control/hack/publish-github-release.sh "$GITHUB_REF_NAME" dist
          "$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL" "$S3_PUBLIC_DOWNLOAD_BASE_URL" "$IMAGE"

  summarize:
    name: Summarize stable release
    needs: [build, publish_oss, publish_s3, publish_ghcr, publish_github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-control
          persist-credentials: false

      - name: Download stable binary payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ github.ref_name }}
          path: dist

      - name: Write published artifact summary
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
        run: >-
          bash release-control/hack/write-release-summary.sh
          "$GITHUB_REF_NAME" dist "$IMAGE" "$IMAGE_DIGEST"

  cleanup:
    name: Delete stable release payloads
    if: >-
      ${{ always() &&
          (needs.build.outputs.binary-artifact-id != '' ||
           needs.build.outputs.image-artifact-id != '') }}
    needs: [build, publish_oss, publish_s3, publish_ghcr, publish_github, summarize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete temporary Actions artifacts
        shell: bash
        env:
          ARTIFACT_IDS: >-
            ${{ needs.build.outputs.binary-artifact-id }}
            ${{ needs.build.outputs.image-artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup_failed=false
          for artifact_id in $ARTIFACT_IDS; do
            if [[ ! "$artifact_id" =~ ^[0-9]+$ ]]; then
              echo "invalid artifact id: $artifact_id" >&2
              cleanup_failed=true
              continue
            fi
            if ! gh api --method DELETE \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; then
              cleanup_failed=true
            fi
          done
          test "$cleanup_failed" = false
