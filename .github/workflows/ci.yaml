name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.18.0
  GOPRIVATE: github.com/dynamia-ai/*

jobs:
  go:
    name: Go checks (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            runner_arch: X64
            goarch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Require private module token
        env:
          HAMI_ENTERPRISE_REPO_TOKEN: ${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}
        run: test -n "$HAMI_ENTERPRISE_REPO_TOKEN"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify native architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = "$EXPECTED_GOARCH"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run local CI contract
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: make ci

  image:
    name: Container build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            runner_arch: X64
            goarch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE_REF: local/hami-cli:${{ github.sha }}-${{ matrix.goarch }}
      IMAGE_PLATFORM: ${{ matrix.platform }}
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      IMAGE_REVISION: ${{ github.sha }}
    steps:
      - name: Require private module token
        env:
          HAMI_ENTERPRISE_REPO_TOKEN: ${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}
        run: test -n "$HAMI_ENTERPRISE_REPO_TOKEN"

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify native architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build and load without publishing
        env:
          HAMI_ENTERPRISE_REPO_TOKEN: ${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}
        run: make build-image

      - name: Inspect image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_REF")" = "$IMAGE_PLATFORM"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$IMAGE_REF")" = "$IMAGE_SOURCE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")" = "$IMAGE_REVISION"

  release-config:
    name: GoReleaser release path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Prepare synthetic GoReleaser binaries
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp /bin/true dist/linux-amd64/hami-cli
          cp /bin/true dist/linux-arm64/hami-cli
          jq -n '[
            {
              type: "Binary",
              goos: "linux",
              goarch: "amd64",
              path: "dist/linux-amd64/hami-cli"
            },
            {
              type: "Binary",
              goos: "linux",
              goarch: "arm64",
              path: "dist/linux-arm64/hami-cli"
            }
          ]' > dist/artifacts.json
          bash hack/prepare-release-image-context.sh dist "$RUNNER_TEMP/release-image"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build multi-architecture release image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ runner.temp }}/release-image
          file: ${{ runner.temp }}/release-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/hami-cli-release-image.tar
          tags: local/hami-cli:ci

  ci-required:
    name: CI required
    if: always()
    needs: [go, image, release-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          GO_RESULT: ${{ needs.go.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          RELEASE_CONFIG_RESULT: ${{ needs.release-config.result }}
        run: |
          test "$GO_RESULT" = success
          test "$IMAGE_RESULT" = success
          test "$RELEASE_CONFIG_RESULT" = success
