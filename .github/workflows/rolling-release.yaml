name: Rolling Release
run-name: Rolling release ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'latest' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish as a mutable branch version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keep the key bounded and serialize manual multi-channel publications across branches.
  group: rolling-release-${{ github.event_name }}
  cancel-in-progress: false

env:
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  GOPRIVATE: github.com/dynamia-ai/*
  GOLANGCI_LINT_VERSION: v2.13.1
  GORELEASER_VERSION: v2.17.1
  OSSUTIL_VERSION: 2.3.0
  OSSUTIL_SHA256: 3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
  IMAGE: ghcr.io/${{ github.repository_owner }}/hami-cli
  ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL }}
  S3_PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.S3_PUBLIC_DOWNLOAD_BASE_URL }}

jobs:
  build:
    name: Build rolling release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      image-digest: ${{ steps.image-archive.outputs.digest }}
      binary-artifact-id: ${{ steps.binary-artifact.outputs.artifact-id }}
      image-artifact-id: ${{ steps.image-artifact.outputs.artifact-id }}
    steps:
      - name: Require main workflow for manual publication
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', inputs.branch) || github.sha }}

      - name: Resolve rolling version
        id: release
        shell: bash
        env:
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" = push ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$revision" = "$GITHUB_SHA"
            version=latest
            source_ref=refs/heads/main
          else
            git check-ref-format --branch "$REQUESTED_BRANCH" >/dev/null
            remote_ref="refs/remotes/origin/$REQUESTED_BRANCH"
            git show-ref --verify --quiet "$remote_ref"
            test "$(git rev-parse "$remote_ref")" = "$revision"

            slug="$(printf '%s' "$REQUESTED_BRANCH" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[._-]+//; s/[._-]+$//; s/-+/-/g')"
            needs_hash=false
            if [[ -z "$slug" ]]; then
              slug=ref
              needs_hash=true
            elif [[ "$slug" != "$REQUESTED_BRANCH" || ${#slug} -gt 96 ]]; then
              needs_hash=true
            fi
            if [[ "$needs_hash" = true ]]; then
              hash="$(printf '%s' "$REQUESTED_BRANCH" | sha256sum | cut -c1-8)"
              slug="${slug:0:96}-$hash"
            fi
            version="branch-$slug"
            source_ref="refs/heads/$REQUESTED_BRANCH"
          fi
          [[ "$version" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          {
            echo '### Rolling release build'
            echo
            echo "- Version: \`$version\`"
            echo "- Source: \`$source_ref\`"
            echo "- Revision: \`$revision\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate private module credential
        env:
          HAMI_ENTERPRISE_REPO_TOKEN: ${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}
        run: test -n "$HAMI_ENTERPRISE_REPO_TOKEN"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run release checks
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: make ci

      - name: Build snapshot artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.HAMI_ENTERPRISE_REPO_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/

      - name: Verify release archive contents
        run: bash hack/verify-release-archives.sh dist

      - name: Stage one-line installer
        if: steps.release.outputs.version == 'latest'
        run: bash hack/prepare-installers.sh dist

      - name: Prepare image context from release binaries
        run: bash hack/prepare-release-image-context.sh dist "$RUNNER_TEMP/release-image"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build mutable image archive
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ runner.temp }}/release-image
          file: ${{ runner.temp }}/release-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/hami-cli-image.tar
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record mutable image digest
        id: image-archive
        run: |
          set -euo pipefail
          digest="$(tar -xOf "$RUNNER_TEMP/hami-cli-image.tar" index.json \
            | jq -r '.manifests | if length == 1 then .[0].digest else error("unexpected manifest count") end')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload rolling binary payload
        id: binary-artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ steps.release.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/install-*.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload rolling image payload
        id: image-artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/hami-cli-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  validate_distribution:
    name: Validate rolling distribution configuration
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false

      - name: Download rolling release payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ needs.build.outputs.version }}
          path: dist

      - name: Validate trusted tooling and payload
        env:
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          VERSION: ${{ needs.build.outputs.version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C release-control rev-parse HEAD)" = "$WORKFLOW_SHA"
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          bash release-control/hack/verify-release-archives.sh dist
          if [[ "$VERSION" = latest ]]; then
            trusted_installers="$(mktemp -d)"
            bash release-control/hack/prepare-installers.sh "$trusted_installers"
            test -s dist/install-oss.sh
            test -s dist/install-r2.sh
            cmp dist/install-oss.sh "$trusted_installers/install-oss.sh"
            cmp dist/install-r2.sh "$trusted_installers/install-r2.sh"
          else
            test ! -e dist/install-oss.sh
            test ! -e dist/install-r2.sh
          fi

      - name: Validate publication credentials and endpoints
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: |
          test -n "$ALIYUN_OSS_ACCESS_KEY_ID"
          test -n "$ALIYUN_OSS_ACCESS_KEY_SECRET"
          test -n "$ALIYUN_OSS_BUCKET"
          test -n "$ALIYUN_OSS_ENDPOINT"
          test -n "$ALIYUN_OSS_REGION"
          test -n "$S3_ACCESS_KEY_ID"
          test -n "$S3_SECRET_ACCESS_KEY"
          test -n "$S3_BUCKET"
          test -n "$S3_ENDPOINT"
          test -n "$S3_REGION"
          test -n "$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL"
          test -n "$S3_PUBLIC_DOWNLOAD_BASE_URL"

  publish_oss:
    name: Publish rolling binaries to OSS
    needs: [build, validate_distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false

      - name: Download rolling binary payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ needs.build.outputs.version }}
          path: dist

      - name: Validate trusted tooling and binary payload
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$(git -C release-control rev-parse HEAD)" = "$WORKFLOW_SHA"
          bash release-control/hack/verify-release-archives.sh dist

      - name: Install ossutil
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          curl -fsSLo "$workdir/ossutil.zip" \
            "https://gosspublic.alicdn.com/ossutil/v2/${OSSUTIL_VERSION}/ossutil-${OSSUTIL_VERSION}-linux-amd64.zip"
          echo "$OSSUTIL_SHA256  $workdir/ossutil.zip" | sha256sum --check --strict
          unzip -q "$workdir/ossutil.zip" -d "$workdir"
          sudo install -m 0755 \
            "$workdir/ossutil-${OSSUTIL_VERSION}-linux-amd64/ossutil" /usr/local/bin/ossutil
          ossutil version

      - name: Publish mutable artifacts to OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash release-control/hack/publish-oss.sh mutable "$VERSION" dist

      - name: Verify public artifacts from OSS
        shell: bash
        env:
          PUBLIC_INSTALLER_ARTIFACT: install-oss.sh
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          bash release-control/hack/verify-public-artifacts.sh "$VERSION" dist
          "aliyun-oss=$ALIYUN_OSS_PUBLIC_DOWNLOAD_BASE_URL"

  publish_s3:
    name: Publish rolling binaries to S3
    needs: [build, validate_distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false

      - name: Download rolling binary payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ needs.build.outputs.version }}
          path: dist

      - name: Validate trusted tooling and binary payload
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$(git -C release-control rev-parse HEAD)" = "$WORKFLOW_SHA"
          bash release-control/hack/verify-release-archives.sh dist

      - name: Verify AWS CLI
        run: |
          aws --version
          aws s3api put-object --generate-cli-skeleton input | jq -e 'has("IfNoneMatch")'

      - name: Publish mutable artifacts to S3
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash release-control/hack/publish-s3.sh mutable "$VERSION" dist

      - name: Verify public artifacts from S3
        shell: bash
        env:
          PUBLIC_INSTALLER_ARTIFACT: install-r2.sh
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          bash release-control/hack/verify-public-artifacts.sh "$VERSION" dist
          "s3=$S3_PUBLIC_DOWNLOAD_BASE_URL"

  publish_ghcr:
    name: Publish rolling image to GHCR
    needs: [build, validate_distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download rolling image payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-image-${{ needs.build.outputs.version }}
          path: dist

      - name: Validate image payload
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          set -euo pipefail
          digest="$(tar -xOf dist/hami-cli-image.tar index.json \
            | jq -r '.manifests | if length == 1 then .[0].digest else error("unexpected manifest count") end')"
          test "$digest" = "$EXPECTED_DIGEST"

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish mutable image archive
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "oci-archive:$GITHUB_WORKSPACE/dist/hami-cli-image.tar" \
            "docker://$IMAGE:$VERSION"

      - name: Resolve and verify image digest
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.image-digest }}
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE:$VERSION"
          manifest="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<< "$manifest")"
          test "$digest" = "$EXPECTED_DIGEST"
          for platform in linux/amd64 linux/arm64; do
            metadata="$(docker buildx imagetools inspect "$image_ref" \
              --format "{{json (index .Image \"$platform\")}}")"
            test "$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$metadata")" = "$EXPECTED_REVISION"
            test "$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<< "$metadata")" = "$VERSION"
          done

  summarize:
    name: Summarize rolling release
    needs: [build, publish_oss, publish_s3, publish_ghcr]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: release-control
          persist-credentials: false

      - name: Download rolling binary payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-binaries-${{ needs.build.outputs.version }}
          path: dist

      - name: Write published artifact summary
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          bash release-control/hack/write-release-summary.sh
          "$VERSION" dist "$IMAGE" "$IMAGE_DIGEST"

  cleanup:
    name: Delete rolling release payloads
    if: >-
      ${{ always() &&
          (needs.build.outputs.binary-artifact-id != '' ||
           needs.build.outputs.image-artifact-id != '') }}
    needs: [build, publish_oss, publish_s3, publish_ghcr, summarize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete temporary Actions artifacts
        shell: bash
        env:
          ARTIFACT_IDS: >-
            ${{ needs.build.outputs.binary-artifact-id }}
            ${{ needs.build.outputs.image-artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cleanup_failed=false
          for artifact_id in $ARTIFACT_IDS; do
            if [[ ! "$artifact_id" =~ ^[0-9]+$ ]]; then
              echo "invalid artifact id: $artifact_id" >&2
              cleanup_failed=true
              continue
            fi
            if ! gh api --method DELETE \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; then
              cleanup_failed=true
            fi
          done
          test "$cleanup_failed" = false
